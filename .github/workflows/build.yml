name: Build Mystic Whyred ReSukiSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential cpio
      - name: Clone Proton Clang
        run: git clone https://github.com/kdrag0n/proton-clang --depth=1 clang
      - name: Clone Mystic + Patch ReSukiSU
        run: |
          git clone https://github.com/okta-10/mystic-kernel-sdm660.git -b mystic kernel --depth=1
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          echo "CONFIG_KSU=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> arch/arm64/configs/whyred_defconfig
      - name: Build
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          mkdir -p out
          make O=out whyred_defconfig
          make O=out -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb
      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3 && rm -rf .git && zip -r9 ../Mystic-CAF-Whyred-ReSukiSU.zip * -x README.md *placeholder
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-CAF-Whyred-ReSukiSU
          path: Mystic-CAF-Whyred-ReSukiSU.zip
