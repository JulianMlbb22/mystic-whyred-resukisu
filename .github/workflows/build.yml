name: Build Mystic ReSukiSU GCC FIX
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential

      - name: GCC Toolchain (buat kernel 4.4)
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Clone Mystic
        run: git clone https://github.com/okta-10/mystic_kernel_sdm660-4.4.git kernel --depth=1

      - name: Add ReSukiSU
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          echo "CONFIG_KSU=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/whyred_defconfig

      - name: Build with GCC (bukan Clang)
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export HOSTCFLAGS="-fcommon"
          mkdir -p out
          make O=out whyred_defconfig
          make O=out -j$(nproc) Image.gz-dtb

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3 && zip -r9 ../Mystic-Whyred-ReSukiSU.zip * -x .git README.md

      - uses: actions/upload-artifact@v4
        with:
          name: Mystic-Whyred-ReSukiSU
          path: Mystic-Whyred-ReSukiSU.zip
