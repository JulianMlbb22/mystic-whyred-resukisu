name: Build Mystic
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential python3 python-is-python3 zip

      - name: Get GCC 4.9
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Clone Kernel
        run: |
          git clone https://github.com/okta-10/mystic_kernel_sdm660-4.4.git kernel --depth=1 --branch Mystic-X9.2

      - name: Patch ReSukiSU + FIX ALL
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh | bash -s main
          
          DEF=arch/arm64/configs/mystic-whyred-newcam_defconfig
          echo "Patch defconfig: $DEF"
          
          sed -i '/CONFIG_KALLSYMS/d' $DEF || true
          sed -i '/CONFIG_KPROBES/d' $DEF || true
          sed -i '/CONFIG_KSU/d' $DEF || true
          sed -i '/CONFIG_WERROR/d' $DEF || true
          echo "CONFIG_KSU=y" >> $DEF
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEF
          echo "CONFIG_KPROBES=y" >> $DEF
          echo "CONFIG_HAVE_KPROBES=y" >> $DEF
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEF
          echo "CONFIG_KALLSYMS=y" >> $DEF
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEF

          # FIX ERROR mcpu=cortex-a73.cortex-a53
          sed -i 's/cortex-a73.cortex-a53/cortex-a53/g' arch/arm64/Makefile || true

          # FIX ERROR BPF + DTC + SCHED
          sed -i '10i #include <linux/err.h>' include/linux/bpf.h || true
          sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i '/Unsupported NR_CPUS/d' include/trace/events/sched.h || true
          sed -i 's/if (!test_bit(NOHZ_STATS_KICK.*/if (0)/' kernel/sched/fair.c || true

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          mkdir -p out
          make O=out mystic-whyred-newcam_defconfig
          make O=out -j$(nproc) Image.gz-dtb HOSTCFLAGS="-fcommon -w" HOSTLDFLAGS="-fcommon -w" KCFLAGS="-w -Wno-error"

      - name: Pack AnyKernel3
        run: |
          ls -lh kernel/out/arch/arm64/boot/Image.gz-dtb
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Mystic-Whyred-ReSukiSU.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Whyred-ReSukiSU
          path: Mystic-Whyred-ReSukiSU.zip
