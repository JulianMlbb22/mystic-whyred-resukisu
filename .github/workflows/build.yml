name: Build Mystic Whyred ReSukiSU MANUAL
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix git
        run: |
          git config --global user.email "julian@kernel.com"
          git config --global user.name "Julian"
          git config --global --add safe.directory '*'

      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio

      - name: Clang
        run: git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Kernel + ReSukiSU Manual
        run: |
          git clone https://github.com/okta-10/mystic-kernel-sdm660.git -b mystic kernel --depth=1
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          git clone https://github.com/ReSukiSU/ReSukiSU.git --depth=1 KernelSU
          # wire manual
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          # config whyred
          echo "CONFIG_KSU=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> arch/arm64/configs/whyred_defconfig
          echo "--- defconfig KSU ---"
          grep KSU arch/arm64/configs/whyred_defconfig

      - name: Build kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          mkdir out
          make O=out whyred_defconfig
          make O=out -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb -k || make O=out -j2 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3 && rm -rf .git && zip -r9 ../Mystic-CAF-Whyred-ReSukiSU-FINAL.zip * -x README.md *placeholder

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Whyred-ReSukiSU-FINAL
          path: Mystic-CAF-Whyred-ReSukiSU-FINAL.zip
