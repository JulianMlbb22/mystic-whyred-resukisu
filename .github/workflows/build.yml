name: Build Mystic Whyred Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential python3 python-is-python3 zip git curl libarchive-tools

      - name: Get Toolchains (GCC 12 + Clang)
        run: |
          # GCC 12 yang support cortex-a73.cortex-a53
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git gcc32
          # Proton Clang untuk clang yang lebih stabil untuk kernel 4.4
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone Kernel
        run: |
          git clone https://github.com/okta-10/mystic_kernel_sdm660-4.4.git kernel --depth=1 --branch Mystic-X9.2

      - name: Patch KernelSU & Fix Makefile
        run: |
          cd kernel
          # Hapus KSU lama jika ada
          rm -rf KernelSU drivers/kernelsu

          # Install ReSukiSU
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh | bash -s main

          DEF=arch/arm64/configs/mystic-whyred-newcam_defconfig

          # Bersihkan config lama yang bentrok
          sed -i '/KALLSYMS/d;/KPROBES/d;/KSU/d;/WERROR/d' $DEF || true
          echo "CONFIG_KSU=y" >> $DEF
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEF
          echo "CONFIG_KPROBES=y" >> $DEF
          echo "CONFIG_KALLSYMS=y" >> $DEF
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEF

          # === FIX UTAMA UNTUK ERROR KAMU ===
          # Error: unknown value 'cortex-a73.cortex-a53' for -mcpu
          # Fix: ganti semua jadi cortex-a53 yang support GCC 4.9 sampai 12
          sed -i 's/cortex-a73.cortex-a53/cortex-a53/g' arch/arm64/Makefile
          sed -i 's/-mcpu=cortex-a73.cortex-a53/-mcpu=cortex-a53/g' arch/arm64/Makefile
          sed -i 's/-mtune=cortex-a73.cortex-a53/-mtune=cortex-a53/g' arch/arm64/Makefile
          
          # Fix tambahan untuk kernel 4.4 di clang baru
          sed -i '10i #include <linux/err.h>' include/linux/bpf.h || true
          sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i '/Unsupported NR_CPUS/d' include/trace/events/sched.h || true
          sed -i 's/if (!test_bit(NOHZ_STATS_KICK.*/if (0)/' kernel/sched/fair.c || true

          echo "=== FIXED Makefile ==="
          grep -n "mcpu\|mtune\|cortex" arch/arm64/Makefile | head -20

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          # PATH untuk clang + gcc
          export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH
          
          # Clang + GCC combo (paling stabil untuk SDM660 4.4 + KSU)
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-elf-"
          export CROSS_COMPILE_ARM32="arm-eabi-"
          
          mkdir -p out
          make O=out mystic-whyred-newcam_defconfig
          make O=out -j$(nproc --all) CC=clang Image.gz-dtb

      - name: Check Output
        run: |
          ls -lh kernel/out/arch/arm64/boot/
          file kernel/out/arch/arm64/boot/Image.gz-dtb

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          # Ganti nama device biar flashable
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh || true
          zip -r9 ../Mystic-Whyred-ReSukiSU.zip * -x .git README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Whyred-ReSukiSU-Fixed
          path: Mystic-Whyred-ReSukiSU.zip
