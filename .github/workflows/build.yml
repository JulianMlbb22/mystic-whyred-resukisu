name: Build Mystic ReSukiSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential python3 python-is-python3 zip
          python --version
          python3 --version

      - name: Get GCC 4.9
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Clone Kernel
        run: git clone https://github.com/okta-10/mystic_kernel_sdm660-4.4.git kernel --depth=1

      - name: Patch ReSukiSU
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh | bash -s main
          
          DEF=arch/arm64/configs/whyred_defconfig
          # KSU
          echo "CONFIG_KSU=y" >> $DEF
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEF
          echo "# CONFIG_KSU_SUSFS is not set" >> $DEF
          echo "# CONFIG_KSU_SUSFS_SUS_PATH is not set" >> $DEF
          echo "# CONFIG_KSU_SUSFS_SUS_MOUNT is not set" >> $DEF
          # KPROBES wajib manual hook
          echo "CONFIG_KPROBES=y" >> $DEF
          echo "CONFIG_HAVE_KPROBES=y" >> $DEF
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEF
          echo "# CONFIG_WERROR is not set" >> $DEF

          # FIX 1: bpf.h
          sed -i '10i #include <linux/err.h>' include/linux/bpf.h

          # FIX 2: cgroup.h 660 FINAL
          python3 << 'PY'
          from pathlib import Path
          p = Path("include/linux/cgroup.h")
          lines = p.read_text().splitlines()
          lines = [l for l in lines if l.strip() not in ("struct cgroup_taskset;", "struct cgroup_subsys_state;")]
          for i, l in enumerate(lines):
              if "cgroup-defs.h" in l:
                  lines.insert(i+1, "struct cgroup_taskset;")
                  lines.insert(i+1, "struct cgroup_subsys_state;")
                  break
          p.write_text("\n".join(lines)+"\n")
          print("cgroup.h patched")
          PY

          # FIX 3: dtc
          sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' scripts/dtc/dtc-lexer.lex.c_shipped || true

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export PATH=$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          mkdir -p out
          make O=out whyred_defconfig
          make O=out -j$(nproc) HOSTCFLAGS="-fcommon -w" HOSTLDFLAGS="-fcommon -w" KCFLAGS="-w -Wno-error" Image.gz-dtb

      - name: Pack AK3
        run: |
          ls -lh kernel/out/arch/arm64/boot/
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Mystic-Whyred-ReSukiSU.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Whyred-ReSukiSU
          path: Mystic-Whyred-ReSukiSU.zip
