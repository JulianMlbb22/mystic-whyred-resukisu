name: Build Mystic ReSukiSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential python3 zip

      - name: Get GCC 4.9
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Clone Kernel
        run: git clone https://github.com/okta-10/mystic_kernel_sdm660-4.4.git kernel --depth=1

      - name: Patch ReSukiSU + FIX cgroup.h 660
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh | bash -s main
          echo "CONFIG_KSU=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/whyred_defconfig

          # FIX 1: bpf.h ERR_PTR
          sed -i '10i #include <linux/err.h>' include/linux/bpf.h

          # FIX 2: cgroup.h:660 - pakai python biar pasti
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("include/linux/cgroup.h")
          txt = p.read_text()
          if "struct cgroup_taskset;" not in txt:
              # cari line yang ada "struct cgroup_taskset *tset"
              lines = txt.splitlines()
              new_lines = []
              for i, line in enumerate(lines):
                  if "struct cgroup_taskset *tset" in line and i>0:
                      # insert forward decl 2 baris diatasnya kalau belum ada
                      if "struct cgroup_taskset;" not in "\n".join(new_lines[-5:]):
                          new_lines.append("struct cgroup_taskset;")
                  new_lines.append(line)
              p.write_text("\n".join(new_lines) + "\n")
              print("Patched cgroup.h")
          else:
              print("Already patched")
          PY

          # cek
          grep -n "cgroup_taskset" include/linux/cgroup.h | head -n 20

          # FIX 3: matikan WERROR
          sed -i 's/CONFIG_WERROR=y/# CONFIG_WERROR is not set/' arch/arm64/configs/whyred_defconfig || true

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export PATH=$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          mkdir -p out
          make O=out whyred_defconfig
          # -w = matikan semua warning
          make O=out -j$(nproc) HOSTCFLAGS="-fcommon -w" KCFLAGS="-w -Wno-error" Image.gz-dtb

      - name: Pack AK3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Mystic-Whyred-ReSukiSU.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Whyred-ReSukiSU
          path: Mystic-Whyred-ReSukiSU.zip
