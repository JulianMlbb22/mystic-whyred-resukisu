name: Build Mystic ReSukiSU Whyred FINAL
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential python3 libncurses-dev

      - name: Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Clone Mystic Kernel
        run: |
          git clone https://github.com/okta-10/mystic_kernel_sdm660-4.4.git kernel --depth=1

      - name: Add ReSukiSU
        run: |
          cd kernel
          # hapus KSU lama kalau ada
          rm -rf KernelSU drivers/kernelsu
          # setup resmi ReSukiSU - ini yang bener, bukan echo manual
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          # aktifkan di defconfig whyred
          echo "CONFIG_KSU=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/whyred_defconfig

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Julian
          mkdir -p out
          make O=out whyred_defconfig
          make O=out -j$(nproc --all) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb

      - name: Make AnyKernel3
        if: success()
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Mystic-Whyred-ReSukiSU-FINAL.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Whyred-ReSukiSU
          path: Mystic-Whyred-ReSukiSU-FINAL.zip
