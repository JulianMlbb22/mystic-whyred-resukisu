name: Build Mystic ReSukiSU Whyred FIX
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          git config --global --add safe.directory '*'
          sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev
      - name: Clang
        run: git clone https://github.com/kdrag0n/proton-clang --depth=1 clang
      - name: Kernel
        run: |
          git clone https://github.com/okta-10/mystic_kernel_sdm660-4.4.git kernel --depth=1
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          git clone https://github.com/ReSukiSU/ReSukiSU.git --depth=1 KernelSU
          echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          echo "CONFIG_KSU=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/whyred_defconfig
      - name: Build
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          mkdir out
          make O=out whyred_defconfig
          make O=out -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb
      - name: AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3 && zip -r9 ../Mystic-Whyred-ReSukiSU.zip * -x .git README.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Whyred-ReSukiSU
          path: Mystic-Whyred-ReSukiSU.zip
