name: Build Mystic ReSukiSU Whyred FIX
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev
      - run: git clone https://github.com/kdrag0n/proton-clang --depth=1 clang && echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
      - run: git clone https://github.com/okta-10/mystic_kernel_sdm660-4.4.git kernel --depth=1
      - name: Add ReSukiSU
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          echo "CONFIG_KSU=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/whyred_defconfig
      - name: Build
        run: |
          cd kernel
          mkdir -p out
          make O=out ARCH=arm64 whyred_defconfig
          make O=out ARCH=arm64 -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCFLAGS="-fcommon" HOSTLDFLAGS="-fcommon" Image.gz-dtb
      - name: Pack
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3 && zip -r9 ../Mystic-Whyred-ReSukiSU.zip * -x .git README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Mystic-Whyred-ReSukiSU
          path: Mystic-Whyred-ReSukiSU.zip
